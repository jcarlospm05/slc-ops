name: WorkFlow Android APK
on:
  push:
    branches:
      - controlops-android-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unpack WorkFlow source
        run: unzip -q controlops-src.zip
      - name: Prepare native Android and launcher
        working-directory: WorkFlow_Android
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/workflow-manifest.xml
          rm -rf android
          flutter create --platforms=android --project-name controlops_android --org com.workflow .
          cp /tmp/workflow-manifest.xml android/app/src/main/AndroidManifest.xml
          cp -R android_launcher/. android/app/src/main/res/
      - name: Remove Flutter demo test
        run: rm -f WorkFlow_Android/test/widget_test.dart
      - name: Install dependencies
        working-directory: WorkFlow_Android
        run: flutter pub get
      - name: Analyze
        working-directory: WorkFlow_Android
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        working-directory: WorkFlow_Android
        run: flutter test
      - name: Build APK
        working-directory: WorkFlow_Android
        run: flutter build apk --debug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkFlow-Android-APK
          path: WorkFlow_Android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
