name: ControlOPS Android APK
on:
  push:
    branches:
      - controlops-android-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unpack ControlOPS source
        run: unzip -q controlops-src.zip
      - name: Prepare Android platform
        working-directory: ControlOPS_Flutter_Android
        run: flutter create --platforms=android --project-name controlops_android --org com.controlops .
      - name: Remove default Flutter demo test
        run: rm -f ControlOPS_Flutter_Android/test/widget_test.dart
      - name: Install dependencies
        working-directory: ControlOPS_Flutter_Android
        run: flutter pub get
      - name: Analyze
        working-directory: ControlOPS_Flutter_Android
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        working-directory: ControlOPS_Flutter_Android
        run: flutter test
      - name: Build APK
        working-directory: ControlOPS_Flutter_Android
        run: flutter build apk --debug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlOPS-Android-APK
          path: ControlOPS_Flutter_Android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
